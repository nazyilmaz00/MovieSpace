<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieSpace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="ust-menu">
        <div class="sol-kisim">
            <li>
                <img src="film.svg" alt="MovieSpace" width="50" height="50">
                <h1>MovieSpace</h1>
            </li>

        </div>


        <nav class="orta-kisim">
            <li>
                <img src="homelogo.svg" alt="vizyon" width="20" height="20">
                <strong><a href="index.html" class="isim">Ana Sayfa</a></strong>
            </li>


            <li>
                <img src="vizyon.svg" alt="vizyon" width="20" height="20">
                <strong><a href="" class="isim">Vizyondakiler</a></strong>
            </li>
            <li>
                <img src="izlediklerim.png" alt="watched" width="20" height="20">
                <strong><a href="" class="isim">İzlediklerim</a></strong>
            </li>

        </nav>

        <div class="sag-kisim">

            <li>
                <img src="hesabım.svg" alt="account" width="20" height="20">
                <strong><a href="girisyap.html" class="isim">Hesabım</a></strong>
            </li>
        </div>

    </header>

    <main>
        <div class="profile-container">
            <h2>Hesabım</h2>
            <form action="hesabim.html" method="POST" class="profile-form">
                <table>
                    <tr>
                        <td><label for="username">Kullanıcı Adı:</label></td>
                        <td>
                            <input type="text" id="username" name="username" value="nazyilmaz" required>
                            <small class="info-text">Kullanıcı adı yılda iki kez değiştirilebilir.</small>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="fullname">İsim Soyisim:</label></td>
                        <td>
                            <input type="text" id="fullname" name="fullname" value="Yeter Naz Yılmaz" required>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="birthdate">Doğum Tarihi:</label></td>
                        <td>
                            <input type="date" id="birthdate" name="birthdate" value="2007-06-06" required>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="password">Yeni Şifre:</label></td>
                        <td>
                            <input type="password" id="password" name="password"
                                placeholder="Değiştirmek istemiyorsanız boş bırakın">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="submit-cell">
                            <button type="submit" class="submit-btn">Değişiklikleri Kaydet</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MovieSpace &middot;Tüm hakları saklıdır.</p>
    </footer>


</body>




</html>
